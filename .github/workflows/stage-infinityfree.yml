name: Stage RewardBridge on InfinityFree

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to upload the current verified AppDeploy build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rewardbridge-infinityfree-stage
  cancel-in-progress: false

jobs:
  mirror-and-deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v6

      - name: Mirror the verified AppDeploy frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mirror dist
          mkdir -p mirror dist
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --domains 6028ef2dad7c557eb4.v2.appdeploy.ai \
            --directory-prefix mirror \
            https://6028ef2dad7c557eb4.v2.appdeploy.ai/
          cp -a mirror/6028ef2dad7c557eb4.v2.appdeploy.ai/. dist/

      - name: Add InfinityFree Apache safeguards
        shell: bash
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          Options -Indexes
          DirectoryIndex index.html
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "camera=(), geolocation=(), payment=()"
          </IfModule>
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.html [L]
          </IfModule>
          HTACCESS

      - name: Validate mirrored release
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/privacy.html
          test -s dist/terms.html
          test -s dist/publisher-agreement.html
          test -s dist/rewards-terms.html
          test -s dist/contact.html
          grep -q 'RewardBridge' dist/index.html
          if grep -RIlE '(CPX_SECURE_HASH|CPX_POSTBACK_TOKEN|PAYPAL_CLIENT_SECRET|SUPABASE_SERVICE_ROLE_KEY|sb_secret_)' dist; then
            echo 'A forbidden secret marker was found in the static release.' >&2
            exit 1
          fi
          find dist -type f -size +10M -print -quit | grep -q . && {
            echo 'InfinityFree release contains a file larger than 10 MB.' >&2
            exit 1
          } || true

      - name: Upload to InfinityFree htdocs through FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/
          server-dir: /htdocs/
          dangerous-clean-slate: false
          log-level: standard
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
