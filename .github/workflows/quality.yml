name: RewardBridge Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rewardbridge-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check source
        run: npm run typecheck

      - name: Build static release
        run: npm run build

      - name: Validate release contents
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html privacy.html terms.html publisher-agreement.html rewards-terms.html contact.html; do
            test -s "dist/$file"
            echo "PASS $file"
          done
          if grep -RInE '(sb_secret_[A-Za-z0-9_-]+|cfat_[A-Za-z0-9_-]+|CPX_SECURE_HASH[[:space:]]*=[[:space:]]*[^[:space:]#]+|CPX_POSTBACK_TOKEN[[:space:]]*=[[:space:]]*[^[:space:]#]+|PAYPAL_CLIENT_SECRET[[:space:]]*=[[:space:]]*[^[:space:]#]+|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^[:space:]#]+)' dist; then
            echo 'A forbidden secret value was found in the static release.' >&2
            exit 1
          fi

      - name: Upload verified static release
        uses: actions/upload-artifact@v4
        with:
          name: rewardbridge-static-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
